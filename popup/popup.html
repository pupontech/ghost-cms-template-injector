<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ghost-CMS Template Injector</title>
    <style>
      :root {
        --surface: #ffffff;
        --text: #1d1d1f;
        --text-2: #6e6e73;
        --text-3: #a1a1a6;
        --line: rgba(0, 0, 0, 0.08);
        --accent: #0a84ff;
        --danger: #ff3b30;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #232325;
          --text: #f5f5f7;
          --text-2: #98989d;
          --text-3: #636366;
          --line: rgba(255, 255, 255, 0.09);
          --accent: #409cff;
          --danger: #ff453a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--surface);
        color: var(--text);
        font-family:
          ui-sans-serif,
          -apple-system,
          'SF Pro Text',
          'Helvetica Neue',
          system-ui,
          sans-serif;
        font-size: 13px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
        min-width: 280px;
        max-width: 320px;
        padding: 16px;
      }
      h1 {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 2px;
      }
      .subtitle {
        margin: 0 0 12px;
        color: var(--text-3);
        font-size: 11.5px;
      }
      #gcti-status {
        font-size: 12px;
        color: var(--text-2);
        background: color-mix(in srgb, var(--text) 5%, transparent);
        border-radius: 8px;
        padding: 7px 10px;
        margin: 0 0 12px;
        min-height: 16px;
      }
      #gcti-status[role='alert'] {
        color: var(--danger);
      }
      ul#gcti-preset-list {
        list-style: none;
        margin: 0 0 4px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #gcti-preset-list button {
        width: 100%;
        text-align: left;
        font: inherit;
        font-weight: 500;
        padding: 9px 11px;
        border: none;
        border-radius: 8px;
        background: color-mix(in srgb, var(--text) 5%, transparent);
        color: inherit;
        cursor: pointer;
        transition: background-color 120ms ease;
      }
      #gcti-preset-list button:hover:not(:disabled) {
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      #gcti-preset-list button:active:not(:disabled) {
        background: color-mix(in srgb, var(--accent) 22%, transparent);
      }
      #gcti-preset-list button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #gcti-prompt-panel,
      #gcti-plan-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        margin: 10px 0 4px;
      }
      #gcti-prompt-panel p,
      #gcti-plan-panel p {
        margin: 0 0 6px;
        font-weight: 600;
      }
      #gcti-prompt-list,
      #gcti-plan-list {
        margin: 0 0 8px;
        padding-left: 18px;
        color: var(--text-2);
      }
      .gcti-prompt-actions,
      .gcti-plan-actions {
        display: flex;
        gap: 6px;
      }
      .gcti-prompt-actions button,
      .gcti-plan-actions button {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px;
        font: inherit;
        cursor: pointer;
      }
      .gcti-prompt-actions button:first-child,
      .gcti-plan-actions button:first-child {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .gcti-prompt-actions button:last-child,
      .gcti-plan-actions button:last-child {
        background: transparent;
        color: inherit;
      }
      #gcti-undo {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px;
        margin: 8px 0 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #gcti-undo:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .gcti-setup-link {
        display: inline-block;
        margin-top: 12px;
        font-size: 12px;
        font-weight: 500;
        color: var(--accent);
        text-decoration: none;
      }
      .gcti-setup-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Ghost-CMS Template Injector</h1>
    <p class="subtitle">Apply a preset to the open editor.</p>
    <p id="gcti-status" role="status" aria-live="polite">Detecting editor…</p>
    <ul id="gcti-preset-list"></ul>
    <section id="gcti-plan-panel" hidden aria-live="polite">
      <p>Review preset plan</p>
      <ul id="gcti-plan-list"></ul>
      <div class="gcti-plan-actions">
        <button id="gcti-plan-apply" type="button">Apply preset</button>
        <button id="gcti-plan-cancel" type="button">Cancel</button>
      </div>
    </section>
    <section id="gcti-prompt-panel" hidden aria-live="polite">
      <p>Confirm preset changes</p>
      <ul id="gcti-prompt-list"></ul>
      <div class="gcti-prompt-actions">
        <button id="gcti-prompt-yes" type="button">Apply changes</button>
        <button id="gcti-prompt-no" type="button">Cancel</button>
      </div>
    </section>
    <button id="gcti-undo" type="button" disabled>Undo last apply</button>
    <a class="gcti-setup-link" href="../setup/setup.html" target="_blank">Setup site access</a>
    <script type="module" src="../dist/popup.js"></script>
  </body>
</html>
