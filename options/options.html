<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ghost Preset Toolbar — Options</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        padding: 16px 20px;
        max-width: 920px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 14px;
        margin: 20px 0 8px;
      }
      #opt-status {
        font-size: 13px;
        margin: 8px 0;
        min-height: 18px;
      }
      #opt-status[role='alert'] {
        color: #b3261e;
      }
      ul#opt-preset-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #opt-preset-list li {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(128, 128, 128, 0.4);
        border-radius: 6px;
        padding: 8px 10px;
      }
      #opt-preset-list li span {
        flex: 1;
      }
      #opt-preset-list li small {
        color: rgba(128, 128, 128, 0.9);
        margin-right: 8px;
      }
      form {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 8px 12px;
        align-items: center;
      }
      form label {
        font-size: 13px;
      }
      form input,
      form textarea,
      form select {
        font: inherit;
        padding: 6px 8px;
        border: 1px solid rgba(128, 128, 128, 0.5);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        width: 100%;
        box-sizing: border-box;
      }
      form textarea {
        min-height: 80px;
      }
      .actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid rgba(128, 128, 128, 0.5);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      textarea#opt-import-area,
      textarea#opt-export-area {
        width: 100%;
        min-height: 120px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Ghost Preset Toolbar — Options</h1>
    <p id="opt-status" role="status">Loading presets…</p>

    <h2>Presets</h2>
    <ul id="opt-preset-list"></ul>

    <h2>Create / edit preset</h2>
    <form id="opt-form" aria-label="Create or edit a preset">
      <label for="opt-id">ID (slug)</label>
      <input id="opt-id" type="text" autocomplete="off" placeholder="my-preset" />

      <label for="opt-name">Name</label>
      <input id="opt-name" type="text" autocomplete="off" />

      <label for="opt-description">Description</label>
      <input id="opt-description" type="text" autocomplete="off" />

      <label for="opt-source">Body source</label>
      <select id="opt-source">
        <option value="inline-html">inline-html</option>
        <option value="ghost-snippet">ghost-snippet</option>
        <option value="inline-lexical">inline-lexical</option>
      </select>

      <label for="opt-mode">Body mode</label>
      <select id="opt-mode">
        <option value="replace">replace</option>
        <option value="only-if-empty">only-if-empty</option>
        <option value="prompt">prompt</option>
      </select>

      <label for="opt-snippet">Snippet name</label>
      <input id="opt-snippet" type="text" autocomplete="off" />

      <label for="opt-html">HTML / Lexical</label>
      <textarea id="opt-html"></textarea>

      <label for="opt-group">Group</label>
      <input id="opt-group" type="text" autocomplete="off" />

      <label for="opt-icon">Icon</label>
      <input id="opt-icon" type="text" autocomplete="off" />

      <div class="actions">
        <button id="opt-save" type="button">Save</button>
        <button id="opt-cancel" type="button">Clear</button>
      </div>
    </form>

    <h2>Import</h2>
    <p>Paste a preset collection (JSON array or <code>{ "presets": [...] }</code>).</p>
    <textarea
      id="opt-import-area"
      aria-label="Import preset collection as JSON"
      placeholder='[{"schemaVersion":1,"id":"example","name":"Example","content":{"source":"inline-html","mode":"replace","html":"<p>Hi</p>"}}]'
    ></textarea>
    <div class="actions">
      <button id="opt-import" type="button">Import</button>
    </div>

    <h2>Export</h2>
    <p>Download all presets (bundled defaults + your overrides) as JSON.</p>
    <textarea id="opt-export-area" aria-label="Exported preset collection" readonly></textarea>
    <div class="actions">
      <button id="opt-export" type="button">Export</button>
    </div>

    <script type="module" src="options.js"></script>
  </body>
</html>
